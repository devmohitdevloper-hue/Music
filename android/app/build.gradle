plugins { id 'com.android.application' }
android {
 namespace 'com.moviesansar.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.moviesansar.app'
  minSdk 26
  targetSdk 35
  versionCode 7
  versionName '7.0'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('generated/webAssets')] } }
}
tasks.register('syncWebAssets', Sync) {
 from(rootProject.projectDir.parentFile) {
  include '*.html', 'manifest.json', 'icon.svg', 'js/**', 'css/**', 'brand/**', 'ad-hosts.txt'
 }
 into(layout.buildDirectory.dir('generated/webAssets'))
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
