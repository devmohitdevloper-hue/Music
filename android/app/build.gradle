plugins { id 'com.android.application' }
android {
 namespace 'com.moviesansar.app'
 signingConfigs { debug { if(rootProject.file('../.signing/debug.keystore').exists()){ storeFile rootProject.file('../.signing/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } } }
 compileSdk 35
 defaultConfig {
  applicationId 'com.moviesansar.app'
  minSdk 26
  targetSdk 35
  versionCode 12
  versionName '12.0'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('generated/webAssets')] } }
}
tasks.register('syncWebAssets', Sync) {
 from(rootProject.projectDir.parentFile) {
  include '*.html', 'manifest.json', 'icon.svg', 'js/**', 'css/**', 'brand/**', 'ad-hosts.txt', 'ad-filter-meta.json', 'licenses/**'
 }
 into(layout.buildDirectory.dir('generated/webAssets'))
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
