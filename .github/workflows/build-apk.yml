name: Build Movie Sansar APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'js/**', 'css/**', '*.html', 'ad-hosts.txt', 'tests/**', 'scripts/**', '.github/workflows/build-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: moviesansar-explicit-debug-signing-v2
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle maintained ad and malware blocklist
        run: python3 scripts/update-ad-filter.py
      - name: Check JavaScript
        run: node tests/runtime.cjs
      - name: Browser regression checks
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/browser.cjs
          node tests/appearance.cjs
      - name: Check live provider integration
        run: node tests/live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Movie-Sansar-v11-Layout-Checks
          path: qa/
          if-no-files-found: ignore
      - name: Prepare persistent debug signing key
        run: |
          mkdir -p .signing
          if [ ! -f .signing/debug.keystore ]; then
            keytool -genkeypair -keystore .signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Movie Sansar Debug,O=Movie Sansar,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build installable debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verify signed APK and packaged assets
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk") as z:
              files=set(z.namelist())
              assert {"classes.dex", "assets/movies.html", "assets/js/watch.js", "assets/ad-hosts.txt"} <= files
              assert not any("study.html" in f or "music.html" in f for f in files)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Movie-Sansar-v11-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
